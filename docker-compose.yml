services:
  api:
    build: .
    ports: ["8002:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://quorum:quorum@db:5432/quorum
      JWT_SECRET: local-compose-only-change-me-before-deployment
      JWT_ISSUER: quorum-local
    depends_on:
      db: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: quorum, POSTGRES_PASSWORD: quorum, POSTGRES_DB: quorum}
    volumes: ["quorum-db:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U quorum -d quorum"], interval: 3s, timeout: 3s, retries: 20}
volumes:
  quorum-db:
