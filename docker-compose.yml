services:
  api:
    build: .
    expose: ["8000"]
    environment: &api_env
      DATABASE_URL: postgresql+psycopg://quorum:quorum@db:5432/quorum
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-compose-only-change-me-before-deployment
      JWT_ISSUER: quorum-local
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  gateway:
    image: nginx:1.27-alpine
    ports: ["8002:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: quorum, POSTGRES_PASSWORD: quorum, POSTGRES_DB: quorum}
    volumes: ["quorum-db:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U quorum -d quorum"], interval: 3s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20}
volumes:
  quorum-db:
