[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-collaborative-workspace"
version = "0.1.0"
description = "A multi-user workspace with WebSocket document updates and version history."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "redis>=5", "PyJWT>=2.9", "pwdlib[argon2]>=0.2", "email-validator>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "websockets>=13"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
